name: Publish

# Tag-triggered publish. Independent per-platform prefixes:
#   ios-v<version>     → validate SPM tag + push CocoaPods trunk
#   android-v<version> → publish AAR + core JAR to Maven Central (Sonatype)
# SPM itself needs no publish step: the git tag IS the release. We validate
# and (for Swift Package Index) tag with a bare vX.Y.Z alias if desired.
on:
  push:
    tags:
      - 'ios-v*'
      - 'android-v*'

jobs:
  ios:
    if: startsWith(github.ref_name, 'ios-v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify podspec version matches tag
        run: |
          version="${GITHUB_REF_NAME##*-v}"
          spec_version=$(grep -E "s.version\s*=" PulseSDK.podspec | head -1 | sed -E "s/.*'([^']+)'.*/\1/")
          if [ "$spec_version" != "$version" ]; then
            echo "Tag $version != podspec $spec_version" && exit 1
          fi

      - name: Build & test
        run: swift test

      - name: Push to CocoaPods trunk
        run: pod trunk push PulseSDK.podspec --allow-warnings
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

  android:
    if: startsWith(github.ref_name, 'android-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify version matches tag
        run: |
          version="${GITHUB_REF_NAME##*-v}"
          grep -q "version = \"$version\"" pulse-core/build.gradle.kts || { echo "core version mismatch"; exit 1; }

      - name: Test
        run: ./gradlew :pulse-core:test

      - name: Publish to Maven Central (Sonatype)
        run: ./gradlew :pulse-core:publish :pulse-android:publish
        env:
          # Sonatype OSSRH credentials + GPG signing key (base64-armored).
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.PULSE_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.PULSE_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_PASSWORD }}
