name: Publish

# Tag-triggered publish. Independent per-platform prefixes:
#   ios-v<version>     → validate SPM tag + push CocoaPods trunk
#   android-v<version> → publish AAR + core JAR to Maven Central
#                        (Central Portal — see RELEASING.md for the one-time
#                        namespace/token/GPG setup)
# SPM itself needs no publish step: the git tag IS the release. We validate
# and (for Swift Package Index) tag with a bare vX.Y.Z alias if desired.
on:
  push:
    tags:
      - 'ios-v*'
      - 'android-v*'

jobs:
  ios:
    if: startsWith(github.ref_name, 'ios-v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify podspec version matches tag
        run: |
          version="${GITHUB_REF_NAME##*-v}"
          spec_version=$(grep -E "s.version\s*=" PulseCircleSDK.podspec | head -1 | sed -E "s/.*'([^']+)'.*/\1/")
          if [ "$spec_version" != "$version" ]; then
            echo "Tag $version != podspec $spec_version" && exit 1
          fi

      - name: Build & test
        run: swift test

      - name: Push to CocoaPods trunk
        run: pod trunk push PulseCircleSDK.podspec --allow-warnings
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

  android:
    if: startsWith(github.ref_name, 'android-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify version matches tag
        run: |
          version="${GITHUB_REF_NAME##*-v}"
          grep -q "version = \"$version\"" pulse-core/build.gradle.kts || { echo "core version mismatch"; exit 1; }

      - name: Test
        run: ./gradlew :pulse-core:test

      - name: Publish to Maven Central (Central Portal)
        # Uploads both modules to central.sonatype.com and auto-releases the
        # validated deployments to repo1.maven.org.
        run: ./gradlew publishAndReleaseToMavenCentral
        env:
          # Central Portal user token (username/password pair) + GPG signing
          # key (ASCII-armored private key block). Env var names are the ones
          # the com.vanniktech.maven.publish plugin reads.
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.PULSE_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.PULSE_SIGNING_PASSWORD }}
